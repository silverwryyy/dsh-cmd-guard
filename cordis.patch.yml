# dsh-cmd-guard bundle patch
#
# Exactly one insert line on purpose. Mounting the same `name` twice would
# load two independent module instances, each holding its own guard state.
# Both modules (guard + changeset) are wired inside a single `apply`, gated
# by `config`.

- insert:
    - id: cmd-guard
      name: dsh-cmd-guard
      config:
        guard:
          enabled: true
        changeset:
          # DEPRECATED: accepted by the schema, not implemented. Turning this on
          # only logs a warning. Left off so a stock profile never claims a
          # write-to-self capability that does not exist.
          enabled: false
